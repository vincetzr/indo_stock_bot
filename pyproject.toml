[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idxbot"
version = "0.1.0"
description = "IDX bandarmology engine: broker-flow reverse engineering, accumulation screener and trading plans"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.scripts]
idxbot = "idxbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idxbot = ["tradingview/pine/*.pine", "report/*.html"]
