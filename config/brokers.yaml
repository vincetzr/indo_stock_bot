  # DX is Bahana - a state-owned house and one of the largest desks on the
  # exchange, and it was missing entirely. It is the clearest single argument
  # for connecting real data before trusting a registry: no amount of desk
  # research had surfaced it, and one afternoon of real broker summary did.
  DX: {name: "DX", tier: local_inst, foreign: false, state_owned: true, confidence: ipot-observed}

  # ---------------- unresolved F/D disagreements ----------------
  # BQ, DR and TP are marked `foreign: true` above on an ownership basis - the
  # parent firms are Korean, Malaysian and Singaporean respectively. The
  # IndoPremier module marks all three DOMESTIC, consistently, every time.
  #
  # Both can be right, because they are answering different questions. The
  # repo's flag asks "who owns the member firm"; the exchange-side flag appears
  # to track the member's own registration status, under which a foreign-parented
  # firm incorporated locally counts as local. This is the same fault line that
  # `foreign_basis` already handles for YP (foreign-owned, retail-serving).
  # Left unchanged rather than overwritten, because picking one silently would
  # destroy the information that they disagree. Resolve against IDX's Anggota
  # Bursa directory before relying on either for these three codes.

  # ---------------- state ownership (BUMN) ----------------
  # `state_owned` is a third axis, independent of `tier` and `foreign`. It comes
  # from the exchange member's own three-way display classification
  # (foreign / bumn / local), observed across 18 stocks x 10 dates with no code
  # ever changing class. Exactly four houses carry it: CC (Mandiri Sekuritas),
  # DX (Bahana), NI (BNI Sekuritas) and OD (BRI Danareksa) - the securities arms
  # of the state banks.
  #
  # It matters because "the state is accumulating" and "a domestic institution
  # is accumulating" are different claims and only one of them is interesting,
  # and because in Indonesia state-linked desks are frequently the counterparty
  # that absorbs foreign selling. A `local_inst` tier alone cannot express that.
