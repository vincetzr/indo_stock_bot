  # ---------------- observed in live data, not yet named ----------------
  # These codes appear in real IDX broker summary (via the IndoPremier public
  # module) but had no entry here, so they were silently defaulting to
  # tier "unknown", foreign: false. That default is not neutral: it pushed
  # genuine foreign flow into the domestic bucket and understated net foreign.
  #
  # The `foreign` flag below is NOT guessed. It is the source's own F/D
  # classification, read from the rendered table and observed across 30 stocks
  # x 3 dates (90 fetches) with zero code changing its flag. Names are left as
  # the bare code deliberately - the flag is evidence, a firm name would be
  # invention. Fill them in from IDX's Anggota Bursa directory and raise
  # `confidence` when you do.
  AG: {name: "AG", tier: unknown, foreign: true,  confidence: ipot-observed}
