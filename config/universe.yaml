    - SMRA, TLKM, TOWR, UNTR, UNVR

  # The deepest-history names on the exchange. Used by `idxbot history` to study
  # broker behaviour across multiple full market cycles (1997 Asian crisis,
  # 2008 GFC, 2013 taper tantrum, 2015 slump, 2020 COVID, 2022 commodity boom).
  deep_history:
    - ASII, BBCA, BBRI, BMRI, BBNI, TLKM, UNVR, GGRM, HMSP, INDF
    - ICBP, KLBF, SMGR, INTP, PTBA, ADRO, UNTR, AALI, LSIP, ITMG
