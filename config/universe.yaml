# Trading universes. Tickers are bare IDX codes; the Yahoo adapter appends ".JK".
#
# NOTE: LQ45 / IDX30 membership is revised by IDX twice a year (February and
# August). Treat these lists as a starting point and refresh them from
# https://www.idx.co.id/en/market-data/stock-index/ before relying on them.
# `idxbot screener --universe all` unions every list defined here.

universes:
  lq45:
    - ACES, ADMR, ADRO, AKRA, AMMN, AMRT, ANTM, ARTO, ASII, BBCA
    - BBNI, BBRI, BBTN, BMRI, BRIS, BRPT, BUKA, CPIN, CTRA, ESSA
