# idxbot configuration. Every threshold the engine uses lives here.

data:
  cache_dir: "data/cache"
  # Providers are tried in order; the first that returns data wins.
  # See README "Data sources" for what each one needs.
  ohlcv_provider: "yahoo"
  broker_summary_providers: ["csv", "synthetic"]
  csv_dir: "data/broker_summary"       # drop your exported broker summary here
  # Generic adapter for a commercial broker-summary vendor. Fill this in after
  # signing up and reading their docs, then use --providers rest.
  # Vendors that advertise per-stock broker/bandarmology data: invezgo.com,
  # ohlc.dev, goapi.io. See docs/LIVE_DATA.md before paying for one.
  rest_broker_summary: {}
  #   name: "invezgo"
  #   url: "https://api.invezgo.com/v1/<their-broker-endpoint>/{ticker}"
  #   api_key_env: "IDXBOT_BROKER_API_KEY"
  #   auth: "bearer"                   # bearer | header | query
  #   date_params: {from: "start", to: "end"}
  #   date_format: "%Y-%m-%d"
  max_history: true                    # pull from first trade date, not N years
  request_timeout: 30
  request_retries: 4

market:
  lot_size: 100                        # 1 lot = 100 shares on IDX
  currency: "IDR"
  # Fraksi harga (tick size) bands: [max_price_exclusive, tick].
  # Prices >= the last band's threshold use the final tick.
  tick_bands:
    - [200, 1]
    - [500, 2]
    - [2000, 5]
    - [5000, 10]
    - [null, 25]
  # Auto rejection limits. IDX has changed these repeatedly (notably the
  # asymmetric ARB regime of 2020-2023). Confirm against the current IDX
  # regulation before sizing positions near a limit.
  auto_rejection:
    ara:                               # [max_price_exclusive, pct]
      - [200, 0.35]
      - [5000, 0.25]
      - [null, 0.20]
    arb_symmetric_pct: 0.15
  # Costs used by the backtester and the trading plan's break-even maths.
  costs:
    buy_fee_pct: 0.0015                # typical retail all-in buy fee
    sell_fee_pct: 0.0025               # includes 0.1% final income tax on sale
    slippage_ticks: 1

# ---------------------------------------------------------------------------
# Broker-flow reverse engineering
# ---------------------------------------------------------------------------
campaigns:
  # A campaign leg is confirmed when inventory retraces this fraction of the
  # prior swing. Higher = fewer, larger campaigns.
  zigzag_retrace: 0.25
  # Ignore campaigns whose size is below this share of the broker's typical
  # inventory swing in that ticker (filters noise).
  min_peak_share: 0.15
  min_accumulation_days: 5
  # Reject legs longer than this: a build spanning most of a year is structural
  # drift (index or custody flow), not a trading campaign.
  max_accumulation_days: 120
  # Span of the EWMA subtracted from inventory to remove that structural drift.
  detrend_span: 120
  # Trailing window used to score "where in the range did they buy".
  entry_percentile_window: 120
  # A leg is "stealth" when price moved less than this while inventory grew.
  stealth_price_move_pct: 0.08

accumulation:
  lookback: 60                         # main detection window (trading days)
  short_lookback: 20
  atr_period: 14
  volume_ma: 20
  # Which weight profile the engine uses by default. Override with --profile.
  #
  # IMPORTANT: cross-sectional testing on 56,745 real observations (2001-2026)
  # found the `accumulation` profile has a NEGATIVE information coefficient on
  # IDX - every contrarian component individually hurt, and only relative
  # strength helped. The `momentum` profile was built from that diagnosis using
  # the training half only, and evaluated on an untouched holdout. See
  # docs/FINDINGS.md before choosing.
  default_profile: "momentum"

  profiles:
    # The original contrarian hypothesis: find quiet bases where a large
    # operator is absorbing supply. REFUTED on price-only data; retained because
    # the broker-flow components remain untested and are the real thesis.
    accumulation:
      inventory_zscore: 0.22           # bulge-desk inventory build vs history
      stealth: 0.18                    # buying without moving price
      concentration: 0.12              # few brokers taking most of the supply
      smart_dumb_divergence: 0.14      # institutions buy while retail sells
      volume_dryup: 0.08               # supply exhaustion in the base
      range_compression: 0.08          # coiling / narrowing range
      obv_divergence: 0.10             # accumulation visible in volume flow
      relative_strength: 0.08          # outperforming IHSG during the base
      wyckoff: 0.15                    # phase structure (spring / sign of strength)

    # Trend-following. Component selection was made on the 2001-2017 training
    # half only; weights are deliberately coarse and equal-ish rather than
    # fitted, because fitting five weights on one market is how you manufacture
    # a backtest that does not survive contact with the future.
    momentum:
      momentum: 0.30                   # 12-1 month return, the classic factor
      relative_strength: 0.25          # vs IHSG - the only component that
                                       # tested positive in the original score
      trend_persistence: 0.25          # share of days held above the 50d MA
      near_high: 0.20                  # proximity to the 52-week high

    # Momentum confirmed by institutional flow. Only meaningful with REAL broker
    # summary connected; untested, and listed as the experiment worth running.
    momentum_plus_flow:
      momentum: 0.22
      relative_strength: 0.18
      trend_persistence: 0.15
      near_high: 0.10
      inventory_zscore: 0.20
      smart_dumb_divergence: 0.15

  # Legacy flat weights, kept so older configs keep working.
  weights:
    inventory_zscore: 0.22
    stealth: 0.18
    concentration: 0.12
    smart_dumb_divergence: 0.14
    volume_dryup: 0.08
    range_compression: 0.08
    obv_divergence: 0.10
    relative_strength: 0.08
    wyckoff: 0.15
  # Screener emits a signal at or above this score.
  signal_threshold: 65
  strong_threshold: 78

plan:
  account_equity_idr: 100000000        # 100 juta - override with --equity
  risk_per_trade_pct: 0.01             # 1% of equity at risk per position
  max_position_pct: 0.20               # cap any single name at 20% of equity
  atr_stop_multiple: 2.0
  # Fallback targets (% gain) when a broker has no campaign history to learn
  # from. When history exists, targets come from that broker's own realised
  # markup distribution.
  fallback_targets: [0.08, 0.15, 0.25]
  time_stop_multiple: 1.5              # x median campaign holding days
  max_time_stop_days: 120              # hard cap regardless of the broker's median
  min_reward_risk: 1.8                 # reject plans below this R:R

# ---------------------------------------------------------------------------
# Intraday day trading (horizon: hours). See docs/DAYTRADE.md for the measured
# base rates - the headline is that the strong setup fires ~17 times a year on a
# 66-name universe and its expectancy straddles zero on daily bars.
# ---------------------------------------------------------------------------
daytrade:
  # "burst" - the strong setup. Measured P(touch +5% next day) = 38.7%.
  rvol_burst: 8.0                      # volume vs 20-day median
  return_burst: 0.07                   # close-to-close on the signal day
  # "surge" - weaker; negative expectancy even optimistically. Kept for study.
  rvol_surge: 5.0
  return_surge: 0.05
  near_high_tolerance: 0.005           # how far below the 20d high still counts
  targets: [0.03, 0.05]                # partial at +3%, rest at the +5% goal
  target_shares: [0.5, 0.5]            # sell half at T1, half at T2
  stop_pct: 0.03                       # median adverse excursion was -2.9%
  risk_per_trade_pct: 0.005            # half the swing risk: worse odds, faster
  opening_range_minutes: 30
  min_volume_pace: 1.5                 # abort if the burst is not sustained
  min_value_traded_idr: 5000000000     # Rp5bn/day liquidity gate
  exit_before_minute: 945              # 15:45 WIB - flat before the close

# ---------------------------------------------------------------------------
# Horizons. Each names a profile and a holding period; the CLI's --horizon
# switch selects one so the same engine serves day, swing and long-term work.
# ---------------------------------------------------------------------------
horizons:
  day:
    profile: momentum
    hold_days: 1
    description: "Intraday burst. Flat by the close. Expectancy straddles zero."
  swing:
    profile: momentum
    hold_days: 20
    description: "Multi-week momentum. Holdout IC +0.031 (t=3.08)."
  long:
    profile: momentum
    hold_days: 60
    description: "The validated horizon. Holdout IC +0.046 (t=4.92)."

backtest:
  horizons: [1, 5, 10, 20, 60]
  score_buckets: [0, 40, 55, 65, 78, 101]
  min_samples: 30

tradingview:
  exchange_prefix: "IDX"
  default_interval: "D"
